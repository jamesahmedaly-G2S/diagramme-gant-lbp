<title>Roadmap — Projet LBP</title>
<style>
  :root{
    color-scheme: light dark;
    --bg: #ffffff;
    --border: #d0d7de;
    --border-soft: #eaeef2;
    --text: #1f2328;
    --text-muted: #656d76;
    --text-faint: #8c959f;
    --row-hover: #f6f8fa;
    --today: #cf222e;
    --green: #1a7f37;
    --accent: #0969da;
    --pill-bg: #ffffff;
    --pill-border: #d0d7de;
    --shadow: 0 1px 0 rgba(31,35,40,.04);
    --highlight-ring: #9a6700;
    --red: #cf222e;
    --orange: #bc4c00;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0d1117; --border: #30363d; --border-soft: #21262d; --text: #e6edf3;
      --text-muted: #8b949e; --text-faint: #6e7681; --row-hover: #161b22;
      --green: #3fb950; --accent: #4493f8; --pill-bg: #0d1117; --pill-border: #30363d;
      --shadow: 0 1px 0 rgba(0,0,0,.2); --red: #f85149; --orange: #db6d28;
    }
  }
  :root[data-theme="dark"]{
    --bg: #0d1117; --border: #30363d; --border-soft: #21262d; --text: #e6edf3;
    --text-muted: #8b949e; --text-faint: #6e7681; --row-hover: #161b22;
    --green: #3fb950; --accent: #4493f8; --pill-bg: #0d1117; --pill-border: #30363d;
    --shadow: 0 1px 0 rgba(0,0,0,.2); --red: #f85149; --orange: #db6d28;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
  }
  .topbar{
    display:flex; align-items:center; gap:10px; padding: 10px 14px; border-bottom: 1px solid var(--border);
    flex-wrap:wrap;
  }
  .topbar h1{ font-size:14px; font-weight:600; margin:0; }
  .topbar .sub{ font-size:11px; color: var(--text-muted); }
  .spacer{ flex:1; }
  .ghbtn{
    background: var(--bg); border:1px solid var(--border); color: var(--text);
    padding: 4px 10px; border-radius: 6px; font-size: 11.5px; cursor:pointer;
  }
  .ghbtn:hover{ background: var(--row-hover); }
  .search{
    background: var(--bg); border:1px solid var(--border); color: var(--text); border-radius:6px;
    padding: 4px 10px; font-size: 11.5px; min-width: 200px;
  }
  .search::placeholder{ color: var(--text-faint); }
  .viewtoggle{ display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .viewtoggle .seg{ border:none; border-radius:0; }
  .viewtoggle .seg + .seg{ border-left:1px solid var(--border); }
  .viewtoggle .seg.active{ background: var(--text); color: var(--bg); }

  .macro-pill{
    position:absolute; top:6px; bottom:6px; border-radius:7px; display:flex; align-items:center; gap:8px;
    padding:0 10px; font-size:12px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden;
    cursor:pointer; box-shadow: 0 1px 2px rgba(0,0,0,.15); transition: filter .1s, transform .1s;
  }
  .macro-pill:hover{ filter:brightness(1.08); transform: translateY(-1px); }
  .macro-pill .mcount{ font-weight:700; opacity:.85; font-size:11px; background:rgba(255,255,255,.22); border-radius:999px; padding:1px 7px; flex:none; }
  .macro-lbl{ font-weight:600; }
  .macro-swatch{ width:11px; height:11px; border-radius:3px; flex:none; }

  .scroll-area{ overflow: auto; max-height: 82vh; }
  .grow{ display:flex; }
  .grow.head{ position: sticky; top:0; z-index: 6; background: var(--bg); }
  .grow.dim .lbl-text, .grow.dim .pill{ opacity:.3; }

  .numcol{ width: 34px; flex:none; display:flex; align-items:center; justify-content:flex-end; padding-right:6px;
    color: var(--text-faint); font-size:11px; border-right:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); height:32px; }
  .grow.head .numcol{ height:38px; border-bottom:1px solid var(--border); }

  .lbl-col{
    position: sticky; left:34px; z-index: 4; background: var(--bg);
    width: 330px; flex:none; border-right: 1px solid var(--border);
  }
  .grow.head .lbl-col{ z-index: 7; border-bottom: 1px solid var(--border); }

  .lbl{ height: 32px; display:flex; align-items:center; gap:6px; padding: 0 10px; border-bottom: 1px solid var(--border-soft); white-space:nowrap; overflow:hidden; cursor:pointer; }
  .lbl:hover{ background: var(--row-hover); }
  .icon{ width:14px; height:14px; flex:none; color: var(--green); }
  .lbl-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; color: var(--text); flex:1 1 auto; min-width:0; }
  .issuenum{ font-size:11px; color: var(--text-faint); flex:none; }

  .tl-col{ position: relative; }
  .day{ width: var(--colw); flex:none; height:32px; border-right: 1px solid var(--border-soft); }
  .grow.head .day{ height:38px; border-bottom:1px solid var(--border); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:3px; }
  .day .mo{ position:absolute; top:3px; left:2px; font-size:10px; font-weight:600; color:var(--text); white-space:nowrap; }
  .day .dn{ font-size:10px; color: var(--text-muted); }
  .day.today-col .dn{ color: var(--today); font-weight:700; }

  .barrow{ position:relative; height:32px; border-bottom: 1px solid var(--border-soft); }
  .pill{
    position:absolute; top:4px; bottom:4px; min-width:18px; border-radius:6px;
    background: var(--pill-bg); border:1px solid var(--pill-border); box-shadow: var(--shadow);
    display:flex; align-items:center; gap:4px; padding:0 6px; font-size:11px; color: var(--text);
    white-space:nowrap; overflow:hidden; cursor:pointer; transition: border-color .1s, box-shadow .15s;
  }
  .pill:hover{ border-color: var(--accent); }
  .pill svg{ width:12px; height:12px; flex:none; color: var(--green); }
  .icon.st-todo, .pill svg.st-todo{ color: var(--red); }
  .icon.st-doing, .pill svg.st-doing{ color: var(--orange); }
  .pill .ptxt{ overflow:hidden; text-overflow:ellipsis; }
  .pill.highlight-self{ box-shadow: 0 0 0 2px var(--highlight-ring); z-index:2; }
  .pill.highlight-dep{ box-shadow: 0 0 0 2px #1a7f37; z-index:2; }
  .pill.highlight-block{ box-shadow: 0 0 0 2px #8250df; z-index:2; }
  .unsched{ position:absolute; left:6px; top:8px; font-size:10.5px; color: var(--text-faint); font-style:italic; }

  .today-line{ position:absolute; top:0; bottom:0; width:0; border-left: 1.5px solid var(--today); z-index:5; pointer-events:none; }
  .today-dot{ position:absolute; top:-5px; left:-3px; width:6px; height:6px; border-radius:50%; background:var(--today); }

  .tooltip{
    position: fixed; z-index: 50; background: var(--bg); border:1px solid var(--border);
    border-radius: 8px; padding: 9px 11px; font-size:11.5px; max-width: 340px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
    pointer-events:none; display:none; line-height:1.5; color: var(--text);
  }
  .tooltip .t-title{ font-weight:600; margin-bottom:4px; }
  .tooltip .t-row{ color: var(--text-muted); }
  .tooltip .t-row b{ color: var(--text); font-weight:600; }
  .tooltip .t-deps{ color:#1a7f37; }
  .tooltip .t-blocks{ color:#8250df; }

  .footer{ padding: 8px 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }

  ::-webkit-scrollbar{ height:10px; width:10px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:6px; }
  ::-webkit-scrollbar-track{ background: transparent; }
</style>
</head>

const MONTHS_FR = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

function parseDate(s){ if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
function fmtShort(d){ return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function dayIndex(d, from){ return Math.round((d - from) / 86400000); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&lt;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const tasks = DATA.tasks.map((t, i) => ({ ...t, row: i + 1, startD: parseDate(t.start), endD: parseDate(t.end), deps: t.deps || [], blocks: t.blocks || [] }));
const taskById = {};
tasks.forEach(t => { taskById[t.id] = t; });

let allStarts = [], allEnds = [];
tasks.forEach(t => { if (t.startD) allStarts.push(t.startD); if (t.endD) allEnds.push(t.endD); });
const globalStart = addDays(new Date(Math.min(...allStarts)), -2);
const globalEnd = addDays(new Date(Math.max(...allEnds)), 2);
const totalDays = dayIndex(globalEnd, globalStart) + 1;

document.getElementById('subtitle').textContent = `${tasks.length} tickets · ${fmtShort(new Date(Math.min(...allStarts)))} → ${fmtShort(new Date(Math.max(...allEnds)))}`;

// Statut : celui de TASK.md, sinon déduit des dates (lignes transverses et backlog)
function taskStatus(t){
  if (t.status) return t.status;
  const today = new Date(); today.setHours(0,0,0,0);
  if (t.endD && t.endD < today) return 'done';
  if (t.startD && t.startD <= today) return 'doing';
  return 'todo';
}
function iconSvg(status = 'done'){
  const mark = status === 'todo' ? '<path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke-width="1.6"/>'
    : status === 'doing' ? '<circle cx="8" cy="8" r="2.4" fill="currentColor" stroke="none"/>'
    : '<path d="M6 8l1.5 1.5L10.5 6" stroke-width="1.6"/>';
  return `<svg class="st-${status}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.3"/>${mark}</svg>`;
}

let colWidth = 24;
const table = document.getElementById('gtable');
let highlighted = null;
let viewMode = 'detail';

const EPIC_ORDER = [
  'Phase 0 — Cadrage', 'Décisions & éléments externes', 'Phase 1 — Socle',
  'Phase 2 — Studio : référentiel & CCN', 'Phase 3 — Clients, questionnaire, affectations',
  'Phase 4 — Versioning & publication', 'Phase 5 — LBP Client', 'Phase 6 — Import DOCX',
  'Phase 7 — Veille réglementaire (n8n)', 'Phase 8 — Notifications', 'Phase 9 — Assistance (chatbot)',
  'Phase 10 — Stripe', 'Phase 11 — Contenus LBP', 'Phase 12 — Production', 'Phase 13 — Recette',
  'Backlog — hors périmètre', 'Documentation technique', 'Recettage (mar. / jeu.)',
];
const EPIC_COLORS = ['#64748b','#ca8a04','#7c3aed','#db2777','#2563eb','#059669','#ea580c','#ca8a04','#0d9488','#dc2626','#16a34a','#7c3aed','#db2777','#2563eb','#dc2626','#94a3b8','#475569','#0891b2'];
const EPIC_SHORT = { 'Phase 0 — Cadrage':'P0', 'Décisions & éléments externes':'ATT', 'Phase 1 — Socle':'P1',
  'Phase 2 — Studio : référentiel & CCN':'P2', 'Phase 3 — Clients, questionnaire, affectations':'P3',
  'Phase 4 — Versioning & publication':'P4', 'Phase 5 — LBP Client':'P5', 'Phase 6 — Import DOCX':'P6',
  'Phase 7 — Veille réglementaire (n8n)':'P7', 'Phase 8 — Notifications':'P8', 'Phase 9 — Assistance (chatbot)':'P9',
  'Phase 10 — Stripe':'P10', 'Phase 11 — Contenus LBP':'P11', 'Phase 12 — Production':'P12', 'Phase 13 — Recette':'P13',
  'Backlog — hors périmètre':'BACKLOG', 'Documentation technique':'DOC', 'Recettage (mar. / jeu.)':'REC' };

const macroStages = EPIC_ORDER.map((epic, i) => {
  const epicTasks = tasks.filter(t => t.epic === epic);
  const starts = epicTasks.map(t => t.startD).filter(Boolean);
  const ends = epicTasks.map(t => t.endD).filter(Boolean);
  return {
    epic, color: EPIC_COLORS[i], short: EPIC_SHORT[epic],
    count: epicTasks.length,
    startD: starts.length ? new Date(Math.min(...starts)) : null,
    endD: ends.length ? new Date(Math.max(...ends)) : null,
  };
}).filter(s => s.count > 0);

function taskMatches(t){
  const q = document.getElementById('search').value.trim().toLowerCase();
  if (!q) return true;
  const hay = `${t.id} ${t.title} ${t.issueNum||''} ${t.epic||''}`.toLowerCase();
  return hay.includes(q);
}

function buildHeader(totalWidth, ti){
  let dayCells = '';
  let bgCells = '';
  for (let i = 0; i < totalDays; i++){
    const d = addDays(globalStart, i);
    const monthLabel = (i === 0 || d.getDate() === 1) ? `<span class="mo">${MONTHS_FR[d.getMonth()]}</span>` : '';
    dayCells += `<div class="day${i === ti ? ' today-col' : ''}" style="width:${colWidth}px">${monthLabel}${colWidth >= 18 ? `<span class="dn">${d.getDate()}</span>` : ''}</div>`;
    bgCells += `<div class="day" style="width:${colWidth}px"></div>`;
  }
  return { dayCells, bgCells };
}

function render(){
  if (viewMode === 'macro') renderMacro(); else renderDetail();
}

function renderMacro(){
  document.documentElement.style.setProperty('--colw', colWidth + 'px');
  const totalWidth = totalDays * colWidth;
  const today = new Date(); today.setHours(0,0,0,0);
  const ti = dayIndex(today, globalStart);
  const { dayCells, bgCells } = buildHeader(totalWidth, ti);

  let rowsHtml = `<div class="grow head">
    <div class="numcol"></div>
    <div class="lbl-col lbl" style="font-weight:600;">Grande étape</div>
    <div class="tl-col" style="display:flex; width:${totalWidth}px;">${dayCells}</div>
  </div>`;

  macroStages.forEach((s, i) => {
    let barHtml = '';
    if (s.startD && s.endD){
      const sIdx = dayIndex(s.startD, globalStart), eIdx = dayIndex(s.endD, globalStart);
      const left = sIdx * colWidth, width = Math.max((eIdx - sIdx + 1) * colWidth - 4, 24);
      barHtml = `<div class="macro-pill" data-stage="${i}" style="left:${left+2}px; width:${width}px; background:${s.color};">
        <span class="macro-lbl">${escapeHtml(s.epic)} · ${fmtShort(s.startD)}–${fmtShort(s.endD)}</span>
        <span class="mcount">${s.count}</span>
      </div>`;
    }
    rowsHtml += `<div class="grow" data-stage="${i}">
      <div class="numcol">${i + 1}</div>
      <div class="lbl-col lbl" data-stage="${i}">
        <span class="macro-swatch" style="background:${s.color}"></span>
        <span class="lbl-text" style="font-weight:600;">${escapeHtml(s.epic)}</span>
        <span class="issuenum">${s.count} tickets</span>
      </div>
      <div class="tl-col barrow" style="width:${totalWidth}px; display:flex;">
        ${bgCells}
        ${barHtml}
      </div>
    </div>`;
  });

  table.innerHTML = rowsHtml;
  addTodayLine(ti);
  document.getElementById('footer').textContent = `${macroStages.length} grandes étapes`;

  table.querySelectorAll('[data-stage]').forEach(el => {
    el.addEventListener('click', () => {
      const s = macroStages[parseInt(el.getAttribute('data-stage'))];
      viewMode = 'detail';
      document.getElementById('btn-view-detail').classList.add('active');
      document.getElementById('btn-view-macro').classList.remove('active');
      document.getElementById('search').value = s.epic;
      render();
    });
    const tooltip = document.getElementById('tooltip');
    el.addEventListener('mousemove', (e) => {
      const s = macroStages[parseInt(el.getAttribute('data-stage'))];
      let html = `<div class="t-title">${escapeHtml(s.epic)}</div>`;
      html += s.startD ? `<div class="t-row">${fmtShort(s.startD)} → ${fmtShort(s.endD)}</div>` : `<div class="t-row">Non planifié</div>`;
      html += `<div class="t-row"><b>${s.count}</b> tickets</div>`;
      html += `<div class="t-row" style="color:var(--text-faint); margin-top:2px;">Clique pour voir le détail</div>`;
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
      const x = Math.min(e.clientX + 14, window.innerWidth - 360);
      const y = Math.min(e.clientY + 14, window.innerHeight - 150);
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    });
    el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

function addTodayLine(ti){
  if (ti >= 0 && ti < totalDays){
    document.querySelectorAll('.grow').forEach((row, i) => {
      const tl = row.querySelector('.tl-col');
      if (!tl) return;
      const line = document.createElement('div');
      line.className = 'today-line';
      line.style.left = (ti * colWidth) + 'px';
      if (i === 0){
        const dot = document.createElement('div');
        dot.className = 'today-dot';
        line.appendChild(dot);
      }
      tl.appendChild(line);
    });
  }
}

function renderDetail(){
  document.documentElement.style.setProperty('--colw', colWidth + 'px');
  const totalWidth = totalDays * colWidth;
  const today = new Date(); today.setHours(0,0,0,0);
  const ti = dayIndex(today, globalStart);
  const { dayCells, bgCells } = buildHeader(totalWidth, ti);
  let rowsHtml = `<div class="grow head">
    <div class="numcol"></div>
    <div class="lbl-col lbl" style="font-weight:600;">Titre</div>
    <div class="tl-col" style="display:flex; width:${totalWidth}px;">${dayCells}</div>
  </div>`;

  let visible = 0;
  tasks.forEach(t => {
    const match = taskMatches(t);
    if (match) visible++;
    let barHtml = '';
    if (t.startD && t.endD){
      const s = dayIndex(t.startD, globalStart), en = dayIndex(t.endD, globalStart);
      const left = s * colWidth, width = Math.max((en - s + 1) * colWidth - 4, 18);
      const label = t.special === 'doc' ? '📄' : (t.special === 'test' ? '🧪' : `[${t.id}] ${escapeHtml(t.title)}${t.issueNum ? ' #' + t.issueNum : ''}`);
      barHtml = `<div class="pill" data-taskid="${t.id}" style="left:${left+2}px; width:${width}px;">${iconSvg(taskStatus(t))}<span class="ptxt">${label}</span></div>`;
    } else {
      barHtml = `<span class="unsched">non planifié</span>`;
    }
    rowsHtml += `<div class="grow" data-taskid="${t.id}" style="display:${match ? 'flex' : 'none'}">
      <div class="numcol">${t.row}</div>
      <div class="lbl-col lbl" data-taskid="${t.id}">
        ${iconSvg(taskStatus(t)).replace('<svg class="', '<svg class="icon ')}
        <span class="lbl-text" title="[${t.id}] ${escapeHtml(t.title)}">[${t.id}] ${escapeHtml(t.title)}</span>
        ${t.issueNum ? `<span class="issuenum">#${t.issueNum}</span>` : ''}
      </div>
      <div class="tl-col barrow" style="width:${totalWidth}px; display:flex;">
        ${bgCells}
        ${barHtml}
      </div>
    </div>`;
  });

  table.innerHTML = rowsHtml;
  addTodayLine(ti);

  document.getElementById('footer').textContent = `${visible} / ${tasks.length} tickets affichés`;

  attachHandlers();
  applyHighlight();
}

function attachHandlers(){
  const tooltip = document.getElementById('tooltip');
  table.querySelectorAll('[data-taskid]').forEach(el => {
    el.addEventListener('mousemove', (e) => {
      const id = el.getAttribute('data-taskid');
      const t = taskById[id];
      let html = `<div class="t-title">[${t.id}] ${escapeHtml(t.title)}${t.issueNum ? ' #' + t.issueNum : ''}</div>`;
      html += t.startD ? `<div class="t-row">${fmtShort(t.startD)} → ${fmtShort(t.endD)}</div>` : `<div class="t-row">Non planifié</div>`;
      if (t.priority) html += `<div class="t-row"><b>Priorité :</b> ${t.priority}${t.phase ? ` · <b>Phase :</b> ${escapeHtml(t.phase)}` : ''}${t.flux && t.flux !== '—' ? ` · <b>${escapeHtml(t.flux)}</b>` : ''}</div>`;
      if (t.epic) html += `<div class="t-row"><b>Chantier :</b> ${escapeHtml(t.epic)}</div>`;
      if (t.deps && t.deps.length) html += `<div class="t-row t-deps"><b>Dépend de :</b> ${t.deps.join(', ')}</div>`;
      if (t.blocks && t.blocks.length) html += `<div class="t-row t-blocks"><b>Bloque :</b> ${t.blocks.join(', ')}</div>`;
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
      const x = Math.min(e.clientX + 14, window.innerWidth - 360);
      const y = Math.min(e.clientY + 14, window.innerHeight - 150);
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    });
    el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    el.addEventListener('click', () => selectTask(el.getAttribute('data-taskid')));
  });
}

function selectTask(id){
  if (highlighted && highlighted.self === id){ highlighted = null; }
  else {
    const t = taskById[id];
    highlighted = { self: id, deps: new Set(t.deps || []), blocks: new Set(t.blocks || []) };
  }
  applyHighlight();
}

function applyHighlight(){
  table.querySelectorAll('.pill').forEach(b => b.classList.remove('highlight-self','highlight-dep','highlight-block'));
  if (!highlighted) return;
  const selfBar = table.querySelector(`.pill[data-taskid="${highlighted.self}"]`);
  if (selfBar) selfBar.classList.add('highlight-self');
  highlighted.deps.forEach(id => { const b = table.querySelector(`.pill[data-taskid="${id}"]`); if (b) b.classList.add('highlight-dep'); });
  highlighted.blocks.forEach(id => { const b = table.querySelector(`.pill[data-taskid="${id}"]`); if (b) b.classList.add('highlight-block'); });
}

document.getElementById('btn-zoom-in').addEventListener('click', () => { colWidth = Math.min(56, colWidth + 6); render(); });
document.getElementById('btn-zoom-out').addEventListener('click', () => { colWidth = Math.max(10, colWidth - 6); render(); });
document.getElementById('btn-today').addEventListener('click', () => {
  const today = new Date(); today.setHours(0,0,0,0);
  const ti = dayIndex(today, globalStart);
  document.getElementById('scroll-area').scrollLeft = Math.max(0, ti * colWidth - 200);
});
document.getElementById('search').addEventListener('input', render);
document.getElementById('btn-view-detail').addEventListener('click', () => {
  viewMode = 'detail';
  document.getElementById('btn-view-detail').classList.add('active');
  document.getElementById('btn-view-macro').classList.remove('active');
  render();
});
document.getElementById('btn-view-macro').addEventListener('click', () => {
  viewMode = 'macro';
  document.getElementById('btn-view-macro').classList.add('active');
  document.getElementById('btn-view-detail').classList.remove('active');
  render();
});

render();
setTimeout(() => {
  const today = new Date(); today.setHours(0,0,0,0);
  const ti = dayIndex(today, globalStart);
  const scroll = document.getElementById('scroll-area');
  if (ti >= 0) scroll.scrollLeft = Math.max(0, ti * colWidth - 150);
}, 50);
</script>
